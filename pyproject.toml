[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamic-effective-carriers"
version = "0.1.0"
description = "Reproducibility package for low-rank dynamics-effective latent carriers"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {file = "LICENSE"}
dependencies = [
  "numpy==2.4.4",
  "torch==2.11.0",
  "matplotlib==3.10.9",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "experiments/joint_velocity_composition/tests"]
addopts = "-q"
